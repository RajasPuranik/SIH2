name: Daily BIS Data Scraper

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          # Fetch full history so we can commit
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Run Puppeteer Scraper
        working-directory: ./backend
        run: npm run scrape
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add backend/database.json
          
          # Only commit if database.json has actually changed
          if git diff --staged --quiet; then
            echo "No changes to BIS database today."
          else
            git commit -m "chore(data): auto-update BIS database from portal"
            git push
            echo "Updated database successfully."
          fi
